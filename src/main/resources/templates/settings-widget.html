<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta
			name="viewport"
			content="width=device-width,height=device-height initial-scale=1" />
	<title>歌曲组件 | Now Playing</title>
	<link rel="icon" type="image/svg+xml" href="/assets/nowplaying.ico" />
	<script id="widget-resource-check">
		// The legacy widget bundle is excluded from the source repository.
		// Keep a missing asset from leaving source/test builds as a blank page.
		window.addEventListener('error', function (event) {
			if (!event.target || !['legacy-widget-app', 'legacy-widget-style'].includes(event.target.id)) return;
			function showResourceError() {
				document.getElementById('widget-resource-error').hidden = false;
				document.body.style.background = '#09090b';
			}
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', showResourceError, { once: true });
			} else {
				showResourceError();
			}
		}, true);
	</script>
	<script id="legacy-widget-app" type="module" crossorigin src="/assets/index-4783303a.js"></script>
	<script src="/assets/jquery.min.js"></script>
	<script src="/assets/jquery-ui.min.js"></script>
	<link id="legacy-widget-style" rel="stylesheet" href="/assets/index-ef1a3273.css">
	<style>
		body {
			overflow: hidden;
		}

		.hidden {
			display: none;
		}

		@media (max-width: 640px) {
			.faq-text {
				margin-left: 0 !important;
			}
		}

		#preview-iframe {
			pointer-events: none;
			width: 100%;
			height: 100%;
		}

		#preview-div {
			z-index: 998;
			position: absolute;
			right: 0;
			bottom: 0;
		}

		#preview-div:hover {
			cursor: grab;
		}

		@media (max-width: 1022px) {
			#preview-div {
				display: none;
			}
		}
	</style>
</head>
<body>
<section id="widget-resource-error" hidden role="alert" style="position:relative;z-index:1000;box-sizing:border-box;max-width:640px;margin:10vh auto;padding:32px;color:#e4e4e7;background:#18181b;border:1px solid #3f3f46;border-radius:16px;font-family:system-ui,sans-serif;line-height:1.8">
	<h1 style="font-size:22px;margin:0 0 12px">歌曲组件设置资源未加载</h1>
	<p>此页面依赖旧版组件设置资源，源码仓库没有包含这些文件，因此测试版无法完整显示该页面。这不是 SPlayer-Next 连接故障。</p>
	<p>歌曲组件设置与播放器页面是两个独立页面。你仍可以查看播放器、调整播放器样式；旧版组件设置需使用包含完整资源的发行版。</p>
	<nav style="display:flex;flex-wrap:wrap;gap:20px">
		<a href="/player" style="color:#60a5fa">查看播放器</a>
		<a href="/settings/player" style="color:#60a5fa">播放器设置</a>
		<a href="/settings/general" style="color:#60a5fa">通用设置</a>
	</nav>
</section>
<div id="root"></div>
<div id="preview-div">
	<iframe id="preview-iframe"></iframe>
</div>

<script>
	$(document).ready(function() {
		var profileId = "";
		var playerId = 0;

		const previewWidths = [600, 750, 320, 500, 480, 580];
		const previewHeights = [220, 170, 420, 270, 260, 240];

		var $previewIframe = $('#preview-iframe');
		var $previewDiv = $("#preview-div");
		var isPreviewing = true;

		// 修改预览窗口的 CSS 属性
		document.getElementById('preview-iframe').onload = function() {
			var previewIframe = document.getElementById('preview-iframe').contentDocument;

			var songInfoElement = previewIframe.querySelector('#songinfo');

			if (songInfoElement) {
				songInfoElement.style.overflow = 'clip';
			}
		};

		// 加载预览窗口
		function loadPreviewIframe() {
			$previewDiv.hide();

			$previewDiv.css({
				width: previewWidths[playerId],
				height: previewHeights[playerId],
			});

			$previewIframe.attr('src', `/widget/${profileId}`);

			if (isPreviewing) {
				$previewDiv.fadeIn(800);
			}

			// 重新限制拖动范围
			$previewDiv.draggable("option", "containment", [0, 0, $(window).width() - previewWidths[playerId], $(window).height() - previewHeights[playerId]]);
		}

		// 监听配置项 profileId 的改变事件
		document.addEventListener('profileIdChanged', function(event) {
			profileId = event.detail;
		});

		// 监听配置项 playerId 的改变事件
		document.addEventListener('playerIdChanged', function(event) {
			playerId = event.detail;
			loadPreviewIframe();
		});

		// 预览按钮的悬停和点击事件
		var $previewBtn = $('#preview-btn');
		$previewBtn.hover(
				function () { $previewBtn.css('background-color', '#464955'); },
				function () { $previewBtn.css('background-color', '#30323b'); });
		$previewBtn.click(function () {
			if ($(this).text() === '关闭预览') {
				isPreviewing = false;
				$previewBtn.text('开启预览');
				$previewBtn.css('background-color', '#f87171');
				$previewDiv.fadeOut(300);
				setTimeout(function () {
					$previewBtn.css('background-color', '#30323b');
				}, 400);
			} else {
				isPreviewing = true;
				$previewBtn.text('关闭预览');
				$previewBtn.css('background-color', '#1db954');
				loadPreviewIframe();
				setTimeout(function () {
					$previewBtn.css('background-color', '#30323b');
				}, 400);
			}
		});

		// 使得预览窗口可拖动
		$previewDiv.draggable({
			start: function() {
				$(this).css("cursor", "grabbing");
			},
			stop: function() {
				$(this).css("cursor", "grab");
			}
		});

		// 页面最下方添加空白区域
		setTimeout(function () {
			$('.bottom-0.left-0.right-0.top-0.box-border.grid.gap-6').append(`
			<div style="height: 160px"></div>
		`);
		}, 200);
	});
</script>
</body>
</html>
